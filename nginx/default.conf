# Single entry point: everything is served from http://localhost
#   /auth/  -> Keycloak (runs with KC_HTTP_RELATIVE_PATH=/auth)
#   /api/   -> backend
#   /       -> frontend (Vite dev server, incl. HMR websocket)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name localhost;

  proxy_http_version 1.1;
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Port  $server_port;
  # WebSocket upgrade (Vite HMR). Kept at server level on purpose: a location that sets any
  # proxy_set_header stops inheriting these, which would drop Host and make Vite reject requests.
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  location /auth/ {
    proxy_pass http://keycloak:8080;
    # Keycloak sends large headers/cookies (tokens); default buffers are too small.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  location /api/ {
    proxy_pass http://backend:3000;
  }

  location / {
    proxy_pass http://frontend:5173;
  }
}
